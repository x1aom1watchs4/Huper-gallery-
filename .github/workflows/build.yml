name: Gallery Mini builds

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-watch:
    name: Build Vela RPK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint watch sources
        run: npm run lint
      - name: Build RPK
        run: npm run build
      - name: Stage RPK
        run: |
          set -euo pipefail
          RPK="$(find dist -type f -name '*.rpk' -print -quit)"
          test -n "$RPK"
          mkdir -p artifacts
          cp "$RPK" artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: gallery-mini-vela-rpk
          path: artifacts/*.rpk
          if-no-files-found: error

  build-phone:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle -p phone assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: gallery-mini-android-apk
          path: phone/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
